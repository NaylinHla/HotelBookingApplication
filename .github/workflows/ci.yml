name: CI

# Runs the unit tests with coverage and SonarQube static analysis, only for
# pull requests from the develop branch into the main branch.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test-analyze:
    name: Build, test and SonarQube analysis
    runs-on: ubuntu-latest
    # Only PRs from develop (in this repository, not a fork) into main.
    if: >
      github.head_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # SonarCloud (free for public repositories). Override SONAR_HOST_URL for a self-hosted SonarQube.
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || github.repository_owner }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || format('{0}_HotelBookingApplication', github.repository_owner) }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: SonarQube needs it for blame info and new-code detection

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java (required by the SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache SonarScanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="$SONAR_HOST_URL"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/wwwroot/lib/**,**/*.db"
          /d:sonar.coverage.exclusions="HotelBooking.Mvc/**,HotelBooking.WebApi/**,HotelBooking.Infrastructure/**"
          /d:sonar.qualitygate.wait=true

      - name: Restore
        run: dotnet restore HotelBooking.sln

      - name: Build
        run: dotnet build HotelBooking.sln --configuration Debug --no-restore

      - name: Run unit tests with coverage
        run: >
          dotnet test HotelBooking.UnitTests
          --configuration Debug
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
